github:
  owner: PangJiutian
  repo: daily-paper-reader
arxiv_paper_setting:
  mode: standard
  days_window: 9
  docs_dir: docs
  prefer_supabase_read: true
  daily_selection:
    max_papers: 5
    min_score: 8.0
    deep_papers: 2
    discovery_tag: ai-discovery
    discovery_max: 1
supabase:
  enabled: true
  url: https://lyucdwgefyfbmaiopjbk.supabase.co
  anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
  papers_table: arxiv_papers
  use_vector_rpc: true
  vector_rpc: match_arxiv_papers
  vector_rpc_ann: match_arxiv_papers
  vector_rpc_exact: match_arxiv_papers_exact
  use_bm25_rpc: true
  bm25_rpc: match_arxiv_papers_bm25
  sync_table: arxiv_sync_status
  sync_success_value: success
  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
  - tag: video-world-models
    description: AI 视频生成与世界模型：关注空间表示、三维一致性、可控生成和世界构建。优先有明确方法贡献及实验验证的生成模型，不限应用领域。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: video generation
      query: Controllable video generation with spatial representations and temporally consistent three-dimensional
        scenes.
      enabled: true
    - keyword: world model
      query: Generative world models that construct persistent interactive 3D worlds with controllable
        dynamics.
      enabled: true
    intent_queries:
    - query: Video diffusion and world models with camera control, object permanence, spatial reasoning
        and multi-view 3D consistency.
      enabled: true
  - tag: sequence-generation
    description: AI 一维数据生成：关注信号、时间序列和多变量序列的生成及条件控制。优先生成机制、可控性和分布建模贡献；仅做预测、分类或数据清洗的工作不够相关。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: time series generation
      query: Conditional generative models for multivariate time series with controllable temporal dynamics.
      enabled: true
    - keyword: signal generation
      query: Diffusion and flow matching models for controllable one-dimensional signal synthesis.
      enabled: true
    intent_queries:
    - query: Generative modeling of multivariate sequences and signals conditioned on attributes, constraints,
        observations or control inputs; evaluate fidelity, diversity and controllability.
      enabled: true
  - tag: reasoning-feedback
    description: LLM/多模态模型参与其他模型训练或推理的闭环：观察任务输出、解释和定位错误、提出可执行修正、验证修正效果。任务可为逆问题、去噪、超分、分类等。优先实验验证的反馈、批判、规划、奖励或验证器方法；仅特征提取、标注或数据处理不够相关，不要求使用
      CoT 术语。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: multimodal feedback
      query: Multimodal models inspect another model output, diagnose errors, propose corrective actions
        and verify improvements.
      enabled: true
    - keyword: language model verifier
      query: Language model critics and verifiers guide training or inference of other models through
        executable feedback and iterative correction.
      enabled: true
    intent_queries:
    - query: Vision-language or large language models use task observations to reason about failures and
        close a correction-and-verification loop for inverse problems, denoising, super-resolution, classification
        or other downstream tasks.
      enabled: true
  - tag: ai-discovery
    description: 少量跨方向启发性 AI 方法论文：优先新的学习机制、泛化原理、模型架构或可迁移的训练方法，有可信实验或理论支撑。与主要三个方向之外的 AI 方法相关；不以普通应用、榜单涨分或综述充数。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: machine learning generalization
      query: Novel transferable machine learning methods, architectures and learning principles with convincing
        evidence and insights beyond standard benchmark gains.
      enabled: true
    intent_queries: []
source_backends:
  arxiv:
    kind: supabase
    enabled: true
    url: https://lyucdwgefyfbmaiopjbk.supabase.co
    anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
    schema: public
    papers_table: arxiv_papers
    use_vector_rpc: true
    vector_rpc: match_arxiv_papers_exact
    vector_rpc_exact: match_arxiv_papers_exact
    use_bm25_rpc: true
    bm25_rpc: match_arxiv_papers_bm25
    sync_table: arxiv_sync_status
    sync_success_value: success
